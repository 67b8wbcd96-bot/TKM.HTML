<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💗 Para ti</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffdde1);
        }

        .corazones span {
            position: absolute;
            bottom: -50px;
            font-size: 30px;
            animation: subir 6s linear infinite;
            opacity: 0.8;
        }

        .corazones span:nth-child(1) { left: 10%; animation-delay: 0s; }
        .corazones span:nth-child(2) { left: 25%; animation-delay: 2s; }
        .corazones span:nth-child(3) { left: 45%; animation-delay: 1s; }
        .corazones span:nth-child(4) { left: 65%; animation-delay: 3s; }
        .corazones span:nth-child(5) { left: 80%; animation-delay: 1.5s; }
        .corazones span:nth-child(6) { left: 90%; animation-delay: 4s; }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .tarjeta {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 650px;
            padding: 60px 30px;
            text-align: center;
            border-radius: 35px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(120, 20, 50, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: clamp(40px, 8vw, 75px);
            color: white;
            text-shadow: 0 5px 15px rgba(150, 0, 50, 0.35);
            animation: latido 1.5s infinite;
        }

        .sub {
            margin-top: 20px;
            font-size: 25px;
            color: white;
            font-weight: bold;
        }

        @keyframes latido {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }
    </style>
</head>

<body>

    <div class="corazones">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>🫶🏼</span>
        <span>💖</span>
        <span>❤️</span>
    </div>

    <div class="tarjeta">
        <h1>Te amoooo muchooo<br>vargitasss 🫶🏼🫶🏼</h1>
        <div class="sub">💗✨💗</div>
    </div>

</body>
</html>
